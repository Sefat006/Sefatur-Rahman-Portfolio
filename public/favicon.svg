<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12111d" />
      <stop offset="100%" stop-color="#08070d" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#22d3ee" />
    </linearGradient>
    <linearGradient id="sGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="45%" stop-color="#e9d5ff" />
      <stop offset="80%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Neon Glow Aura -->
  <rect x="7" y="7" width="50" height="50" rx="16" fill="#8b5cf6" opacity="0.45" filter="url(#softGlow)" />

  <!-- Main Squircle Rounded Box -->
  <rect x="7" y="7" width="50" height="50" rx="15" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2.2" />

  <!-- Corner Ambient Glow Reflection -->
  <circle cx="48" cy="16" r="10" fill="#8b5cf6" opacity="0.3" filter="url(#softGlow)" />

  <!-- Interior Gloss -->
  <path d="M8 22 C8 15 15 8 22 8 L42 8 C49 8 56 15 56 22 C42 25 22 25 8 22 Z" fill="#ffffff" opacity="0.08" />

  <!-- The Bold Stylized Letter S -->
  <text 
    x="32" 
    y="44.5" 
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
    font-size="34" 
    font-weight="900" 
    text-anchor="middle" 
    fill="url(#sGrad)"
    style="text-shadow: 0 0 10px rgba(139, 92, 246, 0.8), 0 0 20px rgba(56, 189, 248, 0.4);"
  >S</text>
</svg>